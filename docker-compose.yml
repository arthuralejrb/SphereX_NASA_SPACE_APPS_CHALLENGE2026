services:
  backend:
    build: ./backEnd
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ProcessorUrl=http://processor:5000
    volumes:
      - ./backEnd/wwwroot/images:/app/wwwroot/images
      - ./backEnd/wwwroot/cache:/app/wwwroot/cache
    depends_on:
      - processor

  frontend:
    build:
      context: ./frontEnd
      args:
        - VITE_API_URL=http://localhost:8080
    container_name: spherex-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
  processor:
    build: ./processor
    ports:
      - "5000:5000"
    environment:
      - OUTPUT_DIR=/app/images
    volumes:
      - ./backEnd/wwwroot/images:/app/images
      - ./processor/dados_fits:/app/dados_fits
