services:
  processor:
    build: ./processor
    container_name: spherex-processor
    ports:
      - "5000:5000"
    volumes:
      - ./backEnd/wwwroot/images:/data

  backend:
    build: ./backEnd
    container_name: spherex-backend
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ProcessorUrl=http://processor:5000
    volumes:
      - ./backEnd/wwwroot/images:/app/wwwroot/images
    depends_on:
      - processor

  frontend:
    build:
      context: ./frontEnd
      args:
        - VITE_API_URL=http://localhost:8080
    container_name: spherex-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend